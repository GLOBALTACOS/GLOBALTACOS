<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLOBALTACOS - リアルタイム為替＆50カ国版</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; height: 50px; flex-shrink: 0; }
    .logo { font-size: 1.2rem; font-weight: bold; color: #f59e0b; }
    .controls { display: flex; gap: 8px; align-items: center; }
    select, button { background: #0f172a; color: #fff; border: 1px solid #475569; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; cursor: pointer; }
    select:hover, button:hover { border-color: #f59e0b; }

    .main-container { display: flex; flex: 1; height: calc(100vh - 50px); width: 100vw; position: relative; }
    #map { flex: 1; height: 100% !important; width: 100% !important; background: #0f172a; }

    .sidebar { width: 350px; background: #1e293b; border-left: 1px solid #334155; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex-shrink: 0; }
    
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    .card-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; color: #f59e0b; }
    
    .fx-panel { background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; padding: 10px; border-radius: 8px; }
    .fx-info { font-size: 0.85rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .status-badge { font-size: 0.7rem; background: #10b981; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: normal; }
    
    .data-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: #cbd5e1; margin: 4px 0; }
    .highlight-val { color: #38bdf8; font-weight: bold; }
    
    .game-box { background: #1e293b; border: 1px solid #475569; border-radius: 6px; padding: 8px; margin-top: 8px; text-align: center; }
    .taco-count { font-size: 1.2rem; font-weight: bold; color: #10b981; margin: 4px 0; }

    .ranking-list { list-style: none; padding: 0; margin: 0; }
    .ranking-item { display: flex; justify-content: space-between; padding: 6px 4px; font-size: 0.85rem; border-bottom: 1px solid #334155; cursor: pointer; transition: background 0.2s; }
    .ranking-item:hover { background: #334155; }

    .custom-pin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
    .pin-over { background: #ef4444; }
    .pin-under { background: #3b82f6; }
    .pin-base { background: #10b981; }
  </style>
</head>

  <header>

        <option value="en">English</option>
        <option value="es">Español</option>

        </div>
      </div>

      <!-- 国詳細 & 旅行者シミュレーター -->

    </div>

      { id: 'EG', name: { ja: 'エジプト', en: 'Egypt', es: 'Egipto' }, lat: 26.8206, lng: 30.8025, priceUsd: 1.20, note: { ja: '通貨切り下げで極めて割安。', en: 'Extremely cheap following currency devaluation.', es: 'Extremadamente barato tras la devaluación de la moneda.' } },
      { id: 'KE', name: { ja: 'ケニア', en: 'Kenya', es: 'Kenia' }, lat: -0.0236, lng: 37.9062, priceUsd: 1.70, note: { ja: '東アフリカのハブ。', en: 'East African regional price standard.', es: 'Estándar regional de precios en África Oriental.' } },
      { id: 'NG', name: { ja: 'ナイジェリア', en: 'Nigeria', es: 'Nigeria' }, lat: 9.0820, lng: 8.6753, priceUsd: 1.50, note: { ja: '通貨変動激しくドル安。', en: 'Volatile local currency leads to cheap USD price.', es: 'Moneda local volátil genera precios bajos en USD.' } },
      { id: 'MA', name: { ja: 'モロッコ', en: 'Morocco', es: 'Marruecos' }, lat: 31.7917, lng: -7.0926, priceUsd: 1.80, note: { ja: 'ローカル価格は安価。', en: 'Very economical local prices.', es: 'Precios locales muy económicos.' } },
      { id: 'SA', name: { ja: 'サウジアラビア', en: 'Saudi Arabia', es: 'Arabia Saudita' }, lat: 23.8859, lng: 45.0792, priceUsd: 3.50, note: { ja: '湾岸諸国の高購買力。', en: 'High purchasing power in Gulf region.', es: 'Alto poder adquisitivo en la región del Golfo.' } },
      { id: 'IL', name: { ja: 'イスラエル', en: 'Israel', es: 'Israel' }, lat: 31.0461, lng: 34.8516, priceUsd: 5.50, note: { ja: '中東で群を抜く高物価。', en: 'Significantly higher costs than neighboring regions.', es: 'Costos significativamente más altos que regiones vecinas.' } },
      { id: 'QA', name: { ja: 'カタール', en: 'Qatar', es: 'Catar' }, lat: 25.3548, lng: 51.1839, priceUsd: 4.20, note: { ja: '富裕国を反映した高水準。', en: 'High cost reflecting wealth of the nation.', es: 'Alto costo que refleja la riqueza de la nación.' } },
      { id: 'GH', name: { ja: 'ガーナ', en: 'Ghana', es: 'Ghana' }, lat: 7.9465, lng: -1.0232, priceUsd: 1.60, note: { ja: '西アフリカの標準コスト。', en: 'Standard price point for West Africa.', es: 'Punto de precio estándar para África Occidental.' } }
    ];

    let map = null, markers = [];
    const basePriceUsd = 2.20; // メキシコ
    let currentUsdJpyRate = 150.0; // デフォルトフォールバック値
    let currentSelectedCountry = countries[0];

    window.onload = () => {
      map = L.map('map').setView([20, 0], 2);
      L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
        attribution: '&copy; 国土地理院', maxZoom: 18
      }).addTo(map);

      // 初回リアルタイム為替取得
      fetchFxRate();
    };

    function changeLanguage() {
      currentLang = document.getElementById('langSelect').value;
      const t = i18n[currentLang];

      // UIテキストの一括書き換え
      document.getElementById('optAll').innerText = t.optAll;
      document.getElementById('optOver').innerText = t.optOver;
      document.getElementById('optUnder').innerText = t.optUnder;
      document.getElementById('labelFx').innerText = t.labelFx;
      document.getElementById('labelApi').innerText = t.labelApi;
      document.getElementById('btnRefresh').innerText = t.btnRefresh;
      document.getElementById('labelRankingTitle').innerText = t.labelRankingTitle;

      document.getElementById('fxRateVal').innerText = `1 USD = ${currentUsdJpyRate.toFixed(2)} JPY`;

      updateView();
      if (currentSelectedCountry) {
        showDetail(currentSelectedCountry);
      }
    }

    // 無料APIからリアルタイム為替（USD→JPY）を取得
    async function fetchFxRate() {
      const statusEl = document.getElementById('apiStatus');
      const t = i18n[currentLang];
      statusEl.innerText = t.fetching;
      statusEl.style.background = '#f59e0b';

      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        const data = await res.json();
        
        if (data && data.rates && data.rates.JPY) {
          currentUsdJpyRate = data.rates.JPY;
          document.getElementById('fxRateVal').innerText = `1 USD = ${currentUsdJpyRate.toFixed(2)} JPY`;
          statusEl.innerText = 'ONLINE';
          statusEl.style.background = '#10b981';
        } else {
          throw new Error('Invalid rate data');
        }
      } catch (err) {
        console.warn('API取得失敗。固定値を使用します:', err);
        document.getElementById('fxRateVal').innerText = `1 USD = ${currentUsdJpyRate.toFixed(2)} JPY ${t.fixed}`;
        statusEl.innerText = 'OFFLINE';
        statusEl.style.background = '#ef4444';
      }

      updateView();
      if (currentSelectedCountry) showDetail(currentSelectedCountry);
    }

    function updateView() {
      const filter = document.getElementById('filterSelect').value;
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const filtered = countries.filter(c => {
        if (filter === 'over') return c.priceUsd > basePriceUsd;
        if (filter === 'under') return c.priceUsd < basePriceUsd;
        return true;
      });

      filtered.forEach(c => {
        let cls = 'pin-base';
        if (c.priceUsd > basePriceUsd) cls = 'pin-over';
        if (c.priceUsd < basePriceUsd) cls = 'pin-under';

        const icon = L.divIcon({
          className: '',
          html: `<div class="custom-pin ${cls}"></div>`,
          iconSize: [12, 12]
        });

        const m = L.marker([c.lat, c.lng], { icon: icon }).addTo(map);
        m.on('click', () => showDetail(c));
        markers.push(m);
      });

      renderRanking(filtered);
    }

    function showDetail(c) {
      currentSelectedCountry = c;
      const t = i18n[currentLang];
      
      const priceJpy = Math.round(c.priceUsd * currentUsdJpyRate);
      const budgetUsd = 1000;
      const tacosBuyable = Math.floor(budgetUsd / c.priceUsd);
      const pppRatio = ((c.priceUsd / basePriceUsd) * 100).toFixed(0);

      const countryName = c.name[currentLang] || c.name.ja;
      const countryNote = c.note[currentLang] || c.note.ja;

      document.getElementById('detailBox').innerHTML = `
        <div class="card-title">
          <span>${countryName}</span>
          <span style="font-size:0.8rem; color:#94a3b8;">${c.priceUsd > basePriceUsd ? t.tagOver : (c.priceUsd === basePriceUsd ? t.tagBase : t.tagUnder)}</span>
        </div>
        <div class="data-row"><span>${t.priceUsd}</span><b class="highlight-val">$${c.priceUsd.toFixed(2)}</b></div>
        <div class="data-row"><span>${t.priceJpy}</span><b style="color:#f59e0b;">約 ${priceJpy.toLocaleString()} 円</b></div>
        <div class="data-row"><span>${t.pppRatio}</span><b>${pppRatio}%</b></div>
        
        <div class="game-box">
          <div style="font-size:0.75rem; color:#cbd5e1;">${t.tripMsg}</div>
          <div class="taco-count">🌮 ${tacosBuyable.toLocaleString()} ${t.buyableMsg}</div>
          <div style="font-size:0.7rem; color:#94a3b8; margin-top:2px;">
            ${tacosBuyable > 400 ? t.highPurchasing : t.lowPurchasing}
          </div>
        </div>

        <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 8px; border-top: 1px dashed #334155; padding-top: 6px;">
          ${t.noteTitle}<br>${countryNote}
        </div>
      `;
      map.panTo([c.lat, c.lng]);
    }

    function renderRanking(list) {
      const sorted = [...list].sort((a, b) => b.priceUsd - a.priceUsd);
      const rankingEl = document.getElementById('rankingList');
      rankingEl.innerHTML = '';

      sorted.forEach((c, idx) => {
        const priceJpy = Math.round(c.priceUsd * currentUsdJpyRate);
        const li = document.createElement('li');
        const countryName = c.name[currentLang] || c.name.ja;
        li.className = 'ranking-item';
        li.onclick = () => showDetail(c);
        li.innerHTML = `
          <span><b>${idx+1}.</b> ${countryName}</span>
          <span><b>$${c.priceUsd.toFixed(2)}</b> <small style="color:#94a3b8;">(${priceJpy.toLocaleString()}円)</small></span>
        `;
        rankingEl.appendChild(li);
      });
    }
  </script>
</body>
</html>
